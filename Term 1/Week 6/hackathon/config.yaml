# Bahn-Puls configuration.
# Everything worth tuning lives here, so changing a
# query or keyword never requires touching Python code.

# ---------------------------------------------------------------------------
# Search queries (Bluesky app.bsky.feed.searchPosts, sort=latest)
# ---------------------------------------------------------------------------
# How Bluesky search behaves (verified 2026-10-09):
#   * Multi-word queries are an AND of the words, not an exact phrase.
#   * Precise passenger phrases ("Anschluss verpasst") are high-precision but
#     rare (~1-5 posts/day each). Broader words ("Deutsche Bahn", "im Zug")
#     give the volume we need for 300 items in 48 h.
#
# needs_context: true  -> the word is ambiguous (e.g. "Verspätung" also means
#   delayed flights or parcels), so we only keep a post if it ALSO contains a
#   rail word from `rail_context` below. This trades a little recall for much
#   better relevance.
#
# Rough volumes measured 2026-10-09 (posts/day before filtering) in comments.
queries:
  # --- precise passenger phrasing (high precision, low volume) ---
  - q: "Zug fällt aus"            # ~2/day
  - q: "Zugausfall"               # ~1/day
  - q: "Zugausfälle"              # ~3/day
  - q: "Anschluss verpasst"       # ~1/day
  - q: "DB Navigator"             # ~3/day
  - q: "Schienenersatzverkehr"    # ~5/day
  - q: "ICE Verspätung"           # ~3/day
  - q: "S-Bahn Ausfall"           # <1/day
  - q: "Stellwerksstörung"        # <1/day
  - q: "Weichenstörung"           # ~1/day
  - q: "Bahnchaos"                # ~1/day
  - q: "Bahnstreik"               # <1/day (spikes during strikes)
  - q: "Zugbegleiter"             # ~3/day
  - q: "Zug voll"                 # ~2/day
  - q: "Klimaanlage Zug"          # ~1/day
  # --- medium-volume rail words ---
  - q: "Deutsche Bahn"            # ~95/day
  - q: "Deutschlandticket"        # ~24/day
  - q: "S-Bahn"                   # ~65/day
  - q: "Regionalbahn"             # ~3/day
  - q: "Regionalexpress"          # ~2/day
  - q: "Bahnsteig"                # ~14/day
  - q: "Bahnfahrt"                # ~3/day
  - q: "Oberleitung"              # ~6/day
  - q: "im Zug"                   # ~63/day
  # --- ambiguous words: kept only with a rail context word ---
  - q: "Verspätung"               # ~45/day before context filter
    needs_context: true
  - q: "Verspätungen"             # ~50/day before context filter
    needs_context: true
  - q: "fällt aus"                # ~70/day before context filter
    needs_context: true
  - q: "überfüllt"                # ~4/day before context filter
    needs_context: true
  - q: "Bahnhof"                  # ~87/day; includes idiom "nur Bahnhof verstehen"
    needs_context: true

# A post passes the context check if any of these regexes matches
# (case-insensitive). \b = word boundary.
#
# These are deliberately tighter than plain 'zug' / 'bahn', which would also
# match Anzug, Umzug, Bezug, Autobahn, Laufbahn, Fahrbahn ...
rail_context:
  - '\bzug(s|es)?\b'
  - '\bzug(ausf|begleit|fahrt|verbind|personal|bindung|teil|führer|chef)'
  - '(regional|nah|fern|nacht|güter|sonder|ersatz|personen)zug'
  - 'züge'                # Züge, Fernzüge, Regionalzüge
  - '\bbahn'              # Bahn, Bahnhof, Bahnsteig, Bahnfahrt
  - '-bahn'               # S-Bahn, U-Bahn
  - 'eisenbahn'
  - '\bice\b'
  - '\bic\b'
  - '\b(re|rb|s)\s?\d{1,3}\b'   # line numbers like RE1, RB 23, S8
  - 'gleis'
  - '\bhbf\b'
  - '\bdb\b'
  - '\bsev\b'
  - 'stellwerk'
  - 'fernverkehr'
  - 'nahverkehr'
  - 'öpnv'
  - 'pendel'              # Pendler, pendeln

# ---------------------------------------------------------------------------
# Paging limits
# ---------------------------------------------------------------------------
fetch:
  page_size: 100            # API maximum
  # On a query's very first run there is no "newest stored post" to stop at,
  # so we cap how far back we read. Backfilled posts are real posts with their
  # real created_at; fetched_at shows they were collected later.
  backfill_hours: 24
  max_pages_per_query: 5    # hard stop so one busy query can't eat the run
  request_pause_seconds: 0.3  # be polite to the API

# ---------------------------------------------------------------------------
# Item filters (applied at fetch time; author info is used in memory only
# and never written to disk)
# ---------------------------------------------------------------------------
filters:
  min_words: 4
  # Handle or display-name patterns that signal an automated account.
  bot_name_patterns:
    - 'bot\b'
    - '\bbot'
    - 'rss'
    - 'feed'
    - 'ticker'
    - 'automat'
    - '🤖'
    - 'störungsmelder'
    - 'verkehrsmeldung'
  # If one author shows up with more than this many posts in a single fetch
  # batch, per hour of time covered, we treat it as automated.
  max_posts_per_author_per_hour: 6
  # Template detector: if the same text (after removing numbers, links and
  # hashtags) appears this many times in one batch, it's a status bot.
  template_repeat_threshold: 3

# ---------------------------------------------------------------------------
# kind = "news" if the post links/embeds one of these domains (subdomains
# match too), otherwise "personal".
# ---------------------------------------------------------------------------
