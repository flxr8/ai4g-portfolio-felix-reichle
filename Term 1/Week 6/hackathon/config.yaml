# ---------------------------------------------------------------------------
# Topics. Each keyword is a regex that must start at a word boundary
# (we prepend \b), matched case-insensitively. So "verspät" matches
# "Verspätung" and "verspätet"; use "voll\b" to avoid matching "vollständig".
# An item can have several topics; items matching none get "other".
# ---------------------------------------------------------------------------
topics:
  delay_cancellation:
    label: "Delays & cancellations"
    keywords: ['verspät', 'fällt aus', 'fiel aus', 'ausgefallen', 'ausfall',
               'zugausf', 'entfällt', 'entfallen', 'gestrichen', 'anschluss',
               'unpünktlich', 'pünktlich', 'störung', 'stellwerk', 'weichen',
               'oberleitung', 'signalstörung', 'umleitung', 'wartezeit',
               'stecken geblieben', 'steckengeblieben', 'stehen seit',
               '\+\s?\d+\s?min', 'minuten später', 'stunden später']
  crowding:
    label: "Crowding"
    keywords: ['voll\b', 'überfüllt', 'rappelvoll', 'brechend voll', 'stehplatz',
               'kein sitzplatz', 'keinen sitzplatz', 'kein platz', 'gedränge',
               'sardinen', 'gequetscht', 'quetsch', 'kurzzug', 'halbe zuglänge',
               'wagen fehl', 'reservierung', 'reserviert']
  app_ticket:
    label: "App & tickets"
    keywords: ['db navigator', 'navigator', 'app\b', 'ticket', 'fahrkarte',
               'sparpreis', 'flexpreis', 'bahncard', 'deutschlandticket',
               'd-ticket', '\d\d[- ]euro[- ]ticket', 'fahrgastrecht',
               'entschädigung', 'erstattung', 'zugbindung', 'buchung',
               'gebucht', 'fahrpreis', 'kontrolle', 'kontrolleur']
  construction:
    label: "Construction & replacement buses"
    keywords: ['baustelle', 'bauarbeiten', 'sanierung', 'generalsanierung',
               'sev\b', 'schienenersatz', 'ersatzverkehr', 'ersatzbus',
               'streckensperrung', 'sperrung', 'gesperrt', 'vollsperrung']
  strike:
    label: "Strikes"
    keywords: ['streik', 'warnstreik', 'bahnstreik', 'gdl\b', 'evg\b',
               'arbeitskampf', 'tarifverhandl', 'tarifstreit']
  service_cleanliness:
    label: "Service, cleanliness & comfort"
    keywords: ['klo\b', 'klos\b', 'toilette', 'wc\b', 'klima', 'heizung',
               'wlan', 'wifi', 'w-lan', 'internet', 'funkloch', 'empfang',
               'dreckig', 'schmutz', 'sauber', 'stinkt', 'personal',
               'zugbegleit', 'schaffner', 'freundlich', 'unfreundlich',
               'durchsage', 'bordbistro', 'speisewagen', 'aufzug', 'fahrstuhl',
               'barrierefrei', 'rollstuhl']
  other:
    label: "Other / general"
    keywords: []

# ---------------------------------------------------------------------------
# Sentiment models. Revisions are pinned to a commit so results are
# reproducible even if the authors update the model on the Hub.
# ---------------------------------------------------------------------------
models:
  m1:
    name: "oliverguhr/german-sentiment-bert"
    revision: "b1177ff59e305c966836ba2825d3dc2efc53f125"
    tokenizer: "oliverguhr/german-sentiment-bert"
    tokenizer_revision: "b1177ff59e305c966836ba2825d3dc2efc53f125"
    preprocess: "germansentiment"
    max_length: 512
    use_safetensors: true    # the repo has model.safetensors
  m2:
    name: "cardiffnlp/twitter-xlm-roberta-base-sentiment"
    revision: "f2f1202b1bdeb07342385c3f807f9c07cd8f5cf8"
    # The Cardiff repo ships only the slow sentencepiece file, which would
    # need the extra `sentencepiece` package. Its sentencepiece.bpe.model is
    # byte-identical (sha256 cfc8146a...2865) to the base model's, so we load
    # the base model's fast tokenizer instead: same vocabulary, same token
    # ids, no extra dependency.
    tokenizer: "FacebookAI/xlm-roberta-base"
    tokenizer_revision: "e73636d4f797dec63c3081bb6ed5c7b0bb3f2089"
    preprocess: "cardiff"
    max_length: 512
    # Only pytorch_model.bin exists at this revision. torch>=2.6 loads .bin
    # files with weights_only=True, so this is safe.
    use_safetensors: false
  batch_size: 16
  # Bound the work per run so a backlog can never make a run time out; the
  # rest is picked up next run.
  max_items_per_run: 600

# ---------------------------------------------------------------------------
# Status checks used by `python -m pulse.status`
# ---------------------------------------------------------------------------
status:
  # GitHub's scheduler is best-effort and can delay runs by 10-30 minutes,
  # so we only raise the alarm after a full hour without a successful run.
  max_minutes_since_success: 60
  max_hours_without_new_items: 6
  max_unclassified_items: 50
  target_items: 300
  target_hours: 48

# Privacy: the post URL contains the author's DID (bsky.app/profile/<did>/...).
# We keep it so the dashboard can link to the original post; set this to
# false to store no URL at all.
store_post_url: true
