# Bahn-Puls collector (Term 1 / Week 6 hackathon)
#
# Reliability: GitHub's `schedule` trigger is best-effort. In our test it fired
# only every 3-10 hours. So the schedule is not the clock any more. Each run
# collects every 10 minutes INSIDE the job for ~5.5 h (jobs are capped at 6 h),
# publishes after every cycle, and then dispatches its own successor.
# GITHUB_TOKEN may trigger workflow_dispatch, so no personal token is needed.
# The hourly cron is only a safety net that restarts the chain if it breaks.
#
# Data lives on the `bahn-puls-data` branch as a single force-pushed commit:
# no merge conflicts with code on main and no history bloat from hundreds of
# binary DB versions. A repo without that branch but with a committed
# data/pulse.db (e.g. a copy of the project) continues from that file.
# The chain runs until the workflow is disabled in the Actions tab.

name: Bahn-Puls collector

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 * * * *"
  push:   # pushing a workflow change (re)starts the chain immediately
    branches: [main]
    paths: [".github/workflows/bahn-puls-collect.yml"]

permissions:
  contents: write   # push the data branch
  actions: write    # dispatch the next run

concurrency:        # one chain only: extra triggers wait, newest pending wins
  group: bahn-puls-collector
  cancel-in-progress: false

env:
  DATA_BRANCH: bahn-puls-data
  RUN_MINUTES: "330"
  HF_HOME: ${{ github.workspace }}/.hf-cache

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    defaults:
      run:
        working-directory: "Term 1/Week 6/hackathon"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Term 1/Week 6/hackathon/requirements.txt"

      - name: Install dependencies
        # CPU-only torch: ~200 MB instead of ~2.5 GB of CUDA libraries.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: hf-models-bahn-puls-v1   # bump if model revisions change

      - name: Restore database
        run: |
          mkdir -p data
          # Exit code 2 = branch doesn't exist yet: keep the committed
          # data/pulse.db if there is one, otherwise start empty. Any other
          # failure aborts, so a network glitch can never replace the real DB.
          rc=0; git ls-remote --exit-code --heads origin "$DATA_BRANCH" > /dev/null || rc=$?
          if [ $rc -eq 0 ]; then
            git fetch --depth=1 origin "$DATA_BRANCH" && git show FETCH_HEAD:pulse.db > data/pulse.db
          elif [ $rc -ne 2 ]; then
            exit 1
          fi

      - name: Collect every 10 minutes
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          TOKEN: ${{ github.token }}
        run: |
          set +e   # handle failures explicitly; one bad cycle must not end the loop
          count() { python -c "import sqlite3; print(sqlite3.connect('data/pulse.db').execute('select count(*) from items').fetchone()[0])" 2>/dev/null || echo 0; }
          publish() {
            # Shrink guard: never publish fewer items than we started with.
            n=$(count)   # count here: inside the subshell below the cwd is $tmp
            [ "$n" -ge "$published" ] || { echo "::error::item count shrank ($published -> $n), not publishing"; return 1; }
            tmp=$(mktemp -d); cp data/pulse.db "$tmp/"
            (cd "$tmp" && git init -q -b "$DATA_BRANCH" && git add pulse.db \
              && git -c user.name=bahn-puls-bot -c user.email=actions@users.noreply.github.com commit -qm "data: $n items" \
              && git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$DATA_BRANCH") \
              && published=$n
          }
          published=$(count)
          end=$(( $(date +%s) + RUN_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            t0=$(date +%s)
            # A failed cycle is recorded in the runs table; the loop carries on.
            python -m pulse.collect || echo "::warning::cycle failed, see log"
            publish || true
            wait=$(( 600 - ($(date +%s) - t0) ))
            if [ $wait -gt 0 ]; then sleep $wait; fi
          done
          echo "### $(count) items collected" >> "$GITHUB_STEP_SUMMARY"

      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bahn-puls-collect.yml --ref main --repo "$GITHUB_REPOSITORY"
